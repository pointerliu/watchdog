[package]
name = "watchdog-core"
version = "0.1.0"
edition = "2021"
description = "Core framework for managing subscriptions"
license = "MIT OR Apache-2.0"

[[example]]
name = "watchdog_system"
path = "examples/watchdog_system.rs"

[[example]]
name = "watchdog_arxiv"
path = "examples/watchdog_arxiv.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
lettre = { version = "0.10", features = ["tokio1", "tokio1-native-tls", "smtp-transport"] }
actix = "0.13"
futures = "0.3"
dashmap = "5.0"
log = "0.4.27"

[dev-dependencies]
watchdog-service = { path = "../watchdog-service" }
derive_builder = "0.13"
arxiv-rs = "0.1.5"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4.27"