[package]
name = "watchdog-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "watchdog-arxiv"
path = "src/bin/watchdog_arxiv.rs"

[dependencies]
actix-web = "4.0"
actix-rt = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
watchdog-core = { path = "../watchdog-core" }
watchdog-service = { path = "../watchdog-service" }
thiserror = "1.0"
async-trait = "0.1"
derive_more = "0.99"
dotenv = "0.15.0"
