[package]
name = "watchdog-arxiv"
version = "0.1.0"
edition = "2021"
description = "ArXiv subscription service example using the watchdog framework"
license = "MIT OR Apache-2.0"

[[bin]]
name = "watchdog-arxiv-complete"
path = "src/bin/complete_server.rs"

[[bin]]
name = "email-notifier-example"
path = "src/bin/email_notifier_example.rs"

[[bin]]
name = "test-email-env"
path = "src/bin/test_email_env.rs"

[dependencies]
watchdog-service = { workspace = true }
watchdog-core = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
actix = "0.13"
actix-web = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
env_logger = "0.10"
thiserror = "1.0"
async-trait = "0.1"
arxiv-rs = "0.1.5"
derive_builder = "0.13"
chrono = { version = "0.4", features = ["serde"] }
lettre = "0.10"