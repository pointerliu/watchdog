[package]
name = "paper-subscriber"
version = "0.1.0"
edition = "2021"

[dependencies]
subscription-framework = { path = "../subscription-framework" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1.89"