[package]
name = "watchdog-arxiv"
version = "0.1.0"
edition = "2021"
description = "ArXiv subscription service example using the watchdog framework"
license = "MIT OR Apache-2.0"

[dependencies]
watchdog-server = { workspace = true }
watchdog = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
actix = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
async-trait = "0.1"
arxiv-rs = "0.1.5"
derive_builder = "0.13"
chrono = { version = "0.4", features = ["serde"] }