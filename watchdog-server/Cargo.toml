[package]
name = "watchdog-server"
version = "0.1.0"
edition = "2021"
description = "Server implementation using the watchdog framework"
license = "MIT OR Apache-2.0"

[dependencies]
watchdog = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
actix = "0.13"
actix-web = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
async-trait = "0.1"
arxiv-rs = "0.1.5"
derive_builder = "0.13"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"