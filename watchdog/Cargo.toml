[package]
name = "watchdog"
version = "0.1.0"
edition = "2021"
description = "Core framework for managing subscriptions"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
lettre = { version = "0.10", features = ["tokio1", "tokio1-native-tls", "smtp-transport"] }